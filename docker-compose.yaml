services:
  db:
    image: postgres:14.17-bookworm
    container_name: medol
    restart: always
    environment:
      POSTGRES_DB: medol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
